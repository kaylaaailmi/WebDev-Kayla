<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Exercise</title>
    <style>
        p{
            font-family:Arial, Helvetica, sans-serif;
            color:blue ;
            font-weight: 500;
        }
        .gumbo{
            font-style: italic;
            color: maroon;
            font-family:'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif
        }
        .hhh{
            font-style: 700;
            color:blue;
            font-family:Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif
        }
        
    </style>
</head>
<body>
    <p style="font-weight: bold; color: maroon;">This is the first sentence</p>
    <p>This is the second sentence</p>
    <p class="gumbo">This is the third sentence</p>
    <p class="hhh">This is the forth sentence</p>

</body>
</html>
